name: Smoke Tests
on:
  workflow_call:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load environment
        run: |
          cp .env.example .env
          grep -v '^#' .env | grep -v '^$' >> "$GITHUB_ENV"
      - name: Start Docker Compose
        run: docker compose up --build -d
      - name: Wait for backend readiness
        run: |
          for i in {1..12}; do
            if curl -fsS http://localhost:8090/actuator/health/readiness; then
              exit 0
            fi
            echo "Waiting for backend readiness..."
            sleep 10
          done
          exit 1
      - name: Check Nginx LB and backend actuator
        run: curl --retry 5 --retry-delay 5 --retry-connrefused -f http://localhost:8090/actuator/health
      - name: Check Backend system info
        run: curl --retry 5 --retry-delay 5 --retry-connrefused -f http://localhost:8090/api/v1/system/info
      - name: Check PostgreSQL
        run: docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
      - name: Check RabbitMQ
        run: curl --retry 5 --retry-delay 5 --retry-connrefused -f -u "$RABBITMQ_USER:$RABBITMQ_PASSWORD" http://localhost:15672/api/health/checks/alarms
      - name: Check MinIO
        run: curl --retry 5 --retry-delay 5 --retry-connrefused -f http://localhost:9000/minio/health/live
      - name: Check Frontend
        run: curl --retry 5 --retry-delay 5 --retry-connrefused -f http://localhost:3000/
      - name: Print Docker Logs on Failure
        if: failure()
        run: docker compose logs
