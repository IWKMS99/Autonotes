name: Infrastructure and E2E Smoke Tests
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Docker and Docker Compose
        uses: docker/setup-buildx-action@v3
      - name: Create .env file
        run: cp .env.example .env
      - name: Start services
        run: docker compose up --build -d
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 45
      - name: Check Backend Infrastructure (Actuator)
        run: curl --retry 5 --retry-delay 10 --retry-connrefused -f http://localhost:8090/actuator/health || exit 1
      - name: Check Frontend (Nginx Proxy to React)
        run: curl --retry 5 --retry-delay 5 --retry-connrefused -f http://localhost:3000/ || exit 1
      - name: Check MinIO
        run: curl --retry 5 --retry-delay 5 --retry-connrefused -I http://localhost:9001/ || exit 1
      - name: Check RabbitMQ
        run: curl --retry 5 --retry-delay 5 --retry-connrefused -I http://localhost:15672/ || exit 1
      - name: Simple E2E Health Check Flow
        run: |
          echo "Simulating API request to get System Info..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/api/v1/system/info)
          if [ "$STATUS" -ne 200 ]; then
            echo "E2E Check failed! Status: $STATUS"
            exit 1
          fi
          echo "E2E Output OK"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
