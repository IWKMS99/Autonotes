x-backend-environment: &backend-env
  SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB}"
  SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
  SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_PROFILES_ACTIVE: "docker,minio-storage"
  JWT_SECRET: "${JWT_SECRET}"
  JWT_EXPIRATION_MS: "${JWT_EXPIRATION_MS}"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
  aws.s3.bucket: "${MINIO_BUCKET}"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "${RABBITMQ_USER}"
  SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
  app.scheduling.cleanup-cron: "${APP_CLEANUP_CRON}"
  app.notes.processing-timeout-minutes: "${APP_PROCESSING_TIMEOUT}"
  app.scheduling.outbox-interval-ms: "${APP_OUTBOX_INTERVAL}"
  app.scheduling.s3-cleanup-cron: "${APP_S3_CLEANUP_CRON}"
  app.scheduling.cleanup-retention-hours: "${APP_S3_RETENTION_HOURS}"
  app.notes.soft-delete-retention-days: "${APP_SOFT_DELETE_RETENTION_DAYS}"
  app.scheduling.soft-delete-cleanup-cron: "${APP_SOFT_DELETE_CLEANUP_CRON}"
  OTEL_SERVICE_NAME: "autonotes-backend"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_INSTRUMENTATION_SPRING_WEB_MVC_ENABLED: "true"
  OTEL_INSTRUMENTATION_JDBC_ENABLED: "true"
  OTEL_INSTRUMENTATION_RABBITMQ_ENABLED: "true"
  OTEL_TRACES_SAMPLER: "always_on"

x-backend-common: &backend-common
  build: ./backend
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
    jaeger:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
    interval: 15s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_CONSOLE_PORT}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT}:16686"
      - "${JAEGER_ZIPKIN_PORT}:9411"
      - "${JAEGER_OTLP_GRPC_PORT}:4317"
      - "${JAEGER_OTLP_HTTP_PORT}:4318"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.3
    volumes:
      - ${PROMETHEUS_SCRAPE_CONFIG:-./monitoring/prometheus.single.yml}:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "${PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    volumes:
      - ./logging/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines | grep -q '\"status\":\"green\"'"]
      interval: 20s
      timeout: 10s
      retries: 15

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5601/api/status"]
      interval: 20s
      timeout: 10s
      retries: 20

  kibana-init:
    image: curlimages/curl:8.8.0
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ./logging/kibana/bootstrap.sh:/bootstrap.sh:ro
      - ./logging/kibana/autonotes.ndjson:/autonotes.ndjson:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    restart: "no"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    user: root
    privileged: true
    volumes:
      - ./logging/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "filebeat test output -e | grep -q 'Connection to backoff(async(tcp://logstash:5044)) established'"]
      interval: 30s
      timeout: 15s
      retries: 6

  backend-1:
    <<: *backend-common
    environment:
      <<: *backend-env
      INSTANCE_ID: "Server 1"
    ports:
      - "8081:8080"

  backend-2:
    <<: *backend-common
    profiles: ["cluster"]
    environment:
      <<: *backend-env
      INSTANCE_ID: "Server 2"
    ports:
      - "8082:8080"

  backend-3:
    <<: *backend-common
    profiles: ["cluster"]
    environment:
      <<: *backend-env
      INSTANCE_ID: "Server 3"
    ports:
      - "8083:8080"

  nginx-lb:
    image: nginx:alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ${NGINX_LB_CONFIG:-./nginx/nginx.single.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy

  nginx-prometheus-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - -nginx.scrape-uri=http://nginx-lb:80/stub_status
    depends_on:
      - nginx-lb

  frontend:
    build: ./frontend
    depends_on:
      - nginx-lb
    ports:
      - "3000:80"

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "${ML_PORT}:${ML_PORT}"
    env_file:
      - .env

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
