version: '3.8'

x-backend-environment: &backend-env
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB}"
  SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
  SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_PROFILES_ACTIVE: "docker,minio-storage"
  JWT_SECRET: "${JWT_SECRET}"
  JWT_EXPIRATION_MS: "${JWT_EXPIRATION_MS}"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
  aws.s3.bucket: "${MINIO_BUCKET}"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "${RABBITMQ_USER}"
  SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
  app.scheduling.cleanup-cron: "${APP_CLEANUP_CRON}"
  app.notes.processing-timeout-minutes: "${APP_PROCESSING_TIMEOUT}"
  app.scheduling.outbox-interval-ms: "${APP_OUTBOX_INTERVAL}"
  app.scheduling.s3-cleanup-cron: "${APP_S3_CLEANUP_CRON}"
  app.scheduling.cleanup-retention-hours: "${APP_S3_RETENTION_HOURS}"
  app.notes.soft-delete-retention-days: "${APP_SOFT_DELETE_RETENTION_DAYS}"
  app.scheduling.soft-delete-cleanup-cron: "${APP_SOFT_DELETE_CLEANUP_CRON}"
  OTEL_SERVICE_NAME: "autonotes-backend"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_INSTRUMENTATION_SPRING_WEB_MVC_ENABLED: "true"
  OTEL_INSTRUMENTATION_JDBC_ENABLED: "true"
  OTEL_INSTRUMENTATION_RABBITMQ_ENABLED: "true"
  OTEL_TRACES_SAMPLER: "always_on"

x-backend-common: &backend-common
  build: ./backend
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
    jaeger:
      condition: service_started
  deploy:
    resources:
      limits:
        memory: 450M

services:
  db:
    image: postgres:16-alpine
    container_name: autonotes-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: autonotes-minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: autonotes-rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_CONSOLE_PORT}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: autonotes-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "9411:9411"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411

  prometheus:
    image: prom/prometheus:latest
    container_name: autonotes-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: autonotes-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # --- ELASTICSEARCH ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: autonotes-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 1500M
    ports:
      - "9200:9200"

  # --- LOGSTASH ---
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: autonotes-logstash
    volumes:
      - ./logging/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 700M

  # --- KIBANA ---
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: autonotes-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 800M

  # --- FILEBEAT ---
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: autonotes-filebeat
    user: root
    privileged: true
    volumes:
      - ./logging/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      - logstash
    deploy:
      resources:
        limits:
          memory: 200M

  # --- CLUSTER ---

  backend-1:
    <<: *backend-common
    container_name: autonotes-backend-1
    environment:
      <<: *backend-env
      INSTANCE_ID: "Server 1"
    ports:
      - "8081:8080"

  backend-2:
    <<: *backend-common
    container_name: autonotes-backend-2
    environment:
      <<: *backend-env
      INSTANCE_ID: "Server 2"
    ports:
      - "8082:8080"

  backend-3:
    <<: *backend-common
    container_name: autonotes-backend-3
    environment:
      <<: *backend-env
      INSTANCE_ID: "Server 3"
    ports:
      - "8083:8080"

  nginx-lb:
    image: nginx:alpine
    container_name: autonotes-lb
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  frontend:
    build: ./frontend
    container_name: autonotes-frontend
    depends_on:
      - nginx-lb
    ports:
      - "3000:80"
    restart: always

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data: