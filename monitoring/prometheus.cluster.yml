global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'autonotes-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend-1:8080', 'backend-2:8080', 'backend-3:8080']
        labels:
          group: 'production'

  - job_name: 'nginx-lb'
    static_configs:
      - targets: ['nginx-prometheus-exporter:9113']
