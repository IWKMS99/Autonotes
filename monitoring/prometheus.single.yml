global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: 'autonotes-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend-1:8080']
        labels:
          group: 'production'
          service: 'autonotes-backend'
          environment: 'local'
          mode: 'single'

  - job_name: 'nginx-lb'
    static_configs:
      - targets: ['nginx-prometheus-exporter:9113']
        labels:
          service: 'nginx-lb'
          environment: 'local'
          mode: 'single'
